# The Lemon Quest em Docker.
#   Subir / atualizar:  docker compose up -d --build
#   Ver logs:           docker compose logs -f
#   Parar (salva tudo): docker compose stop
# Guia completo: deploy/docker/README.md
#
# ATENÇÃO: não rode junto com o serviço do Windows (NSSM) — os dois usam a porta 2567.

services:
  lemonquest:
    build: .
    image: lemonquest:latest
    container_name: lemonquest
    restart: unless-stopped          # sobe com o Docker e reinicia se cair (papel do NSSM)
    init: true                       # repassa sinais corretamente e evita processos zumbis
    ports:
      - "2567:2567"
    environment:
      PORT: "2567"
      TZ: "America/Sao_Paulo"        # horário dos backups (lemonquest-AAAAMMDD-HH.db) e dos logs
      # Administradores (personagens): /kick /mute /unmute /anuncio /online /resetsenha /tp /status /evento /desbloquear — funcionam em produção.
      LEMONQUEST_ADMINS: "V1R4 L4T4 C4R4M3L0, Leonardo"
      # Contas (login, não personagem) que podem CRIAR um personagem com nome de admin. Sem isto o nome fica reservado:
      # ninguém o cria (um personagem admin que já existe continua funcionando normalmente).
      # LEMONQUEST_ADMIN_ACCOUNTS: "leonardo"
      # Comandos de desenvolvimento (/level, /item...) — só fora de produção; deixe desligado no escritório.
      # LEMONQUEST_DEV_COMMANDS: "1"
      # Cópia extra dos backups em outro disco/compartilhamento (1 por dia, 14 dias). Monte o volume abaixo.
      # LEMONQUEST_BACKUP_COPY_DIR: "/backup-copy"
      # ClickUp no jogo ("Chegou!", sprints, aba "Na obra", /vincular): token pessoal (pk_…) no arquivo .env ao lado
      # deste compose, nunca aqui. Vazio = sistema desligado. Leitura a cada LEMONQUEST_CLICKUP_POLL_MIN minutos (padrão 5).
      LEMONQUEST_CLICKUP_TOKEN: ${LEMONQUEST_CLICKUP_TOKEN:-}
      LEMONQUEST_CLICKUP_POLL_MIN: ${LEMONQUEST_CLICKUP_POLL_MIN:-5}
    volumes:
      # Banco (lemonquest.db) e backups ficam aqui, na pasta do projeto, fora do container.
      - ./docker-data:/app/data
      # Cópia externa dos backups (outro disco, NAS, pasta de rede já montada no host):
      # - /mnt/nas/lemonquest:/backup-copy           # Linux
      # - D:/backups-lemonquest:/backup-copy           # Windows (Docker Desktop)
    stop_grace_period: 30s           # tempo para salvar os jogadores antes de o Docker forçar a parada
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
